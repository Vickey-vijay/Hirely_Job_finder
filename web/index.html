<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3F6FB" />
    <title>Hirely: only the jobs you can actually get</title>
    <script>
      /* Sets the saved theme before first paint, so dark mode never flashes light. Storage can throw; then the device setting applies. */
      (function () {
        try {
          var t = localStorage.getItem("hirely-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Tell us your role and skills once. Hirely watches public job sources all day and sends you only the jobs that fit, scored 1 to 10, on WhatsApp and email. From ₹99 a month." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231F5FD1'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230E9F6E'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
