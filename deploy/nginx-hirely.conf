# Hirely site. __DOMAIN__ is replaced by setup-server.sh.
# It only answers for its own host name, so other sites on this nginx are not affected.
# After a domain change: edit server_name, then  sudo certbot --nginx -d yourdomain.in
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /srv/hirely/web/dist;
    index index.html;

    # API and webhooks -> Node on localhost
    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;      # tailored resumes can take a while
        client_max_body_size 6m;      # resume uploads (5 MB limit in the app)
    }

    # Hashed build assets can be cached for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React single-page app: unknown paths serve index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
